# Настройки для сервера: контейнер не публикует порт наружу,
# а подключается к сети Docker, в которой работает обратный прокси Caddy.
# Запуск: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  app:
    ports: !reset []
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-app_default}
